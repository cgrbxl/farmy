<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 370" role="img" aria-labelledby="title desc">
<title id="title">Two implemented information paths share Wallet authority</title><desc id="desc">The document path connects Local Folder to Processing and Knowledge. The observation path connects Synthetic Sensor to a consumer. Dotted lines represent Wallet authorisation. Model-assisted answers and export remain planned.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m0 0 10 5L0 10Z" fill="#759167"/></marker></defs>
<rect x="22" y="100" width="770" height="234" rx="16" fill="#edf1e5"/>
<text x="43" y="126" font-family="sans-serif" font-size="10" fill="#6f8266" letter-spacing="1">IMPLEMENTED REFERENCE PATHS</text>
<rect x="338" y="15" width="208" height="58" rx="11" fill="#194d3c"/><text x="442" y="39" font-family="sans-serif" font-size="15" font-weight="600" fill="#fffdf0" text-anchor="middle">Wallet authority</text><text x="442" y="57" font-family="sans-serif" font-size="10" fill="#c7dbb8" text-anchor="middle">Identity · ownership · permissions</text>
<path d="M365 73v11H143v57M442 73v68m70-68v11h155v57" fill="none" stroke="#90a77b" stroke-width="1.6" stroke-dasharray="4 5"/>
<text x="32" y="57" font-family="sans-serif" font-size="11" fill="#72816a">Dotted lines: authority checks</text>
<g font-family="sans-serif">
<rect x="48" y="146" width="190" height="72" rx="10" fill="#fffefa" stroke="#cdd9c0"/><text x="143" y="173" font-size="14" fill="#264e38" text-anchor="middle" font-weight="600">Local Folder Connector</text><text x="143" y="193" font-size="10" fill="#6f8266" text-anchor="middle">Exact document snapshot</text>
<rect x="340" y="146" width="190" height="72" rx="10" fill="#fffefa" stroke="#cdd9c0"/><text x="435" y="173" font-size="14" fill="#264e38" text-anchor="middle" font-weight="600">Processing</text><text x="435" y="193" font-size="10" fill="#6f8266" text-anchor="middle">Proposed field + provenance</text>
<rect x="595" y="146" width="170" height="72" rx="10" fill="#fffefa" stroke="#cdd9c0"/><text x="680" y="173" font-size="14" fill="#264e38" text-anchor="middle" font-weight="600">Knowledge</text><text x="680" y="193" font-size="10" fill="#6f8266" text-anchor="middle">Permission-checked evidence</text>
<path d="M238 182h93m201 0h54" fill="none" stroke="#759167" stroke-width="2" marker-end="url(#arrow)"/>
<text x="282" y="172" font-size="9" fill="#72816a" text-anchor="middle">authorised bytes</text>
<rect x="48" y="248" width="190" height="63" rx="10" fill="#fffefa" stroke="#cdd9c0"/><text x="143" y="273" font-size="14" fill="#264e38" text-anchor="middle" font-weight="600">Synthetic Sensor</text><text x="143" y="291" font-size="10" fill="#6f8266" text-anchor="middle">Source-scoped observations</text>
<rect x="340" y="248" width="190" height="63" rx="10" fill="#fffefa" stroke="#cdd9c0"/><text x="435" y="273" font-size="14" fill="#264e38" text-anchor="middle" font-weight="600">Authorised consumer</text><text x="435" y="291" font-size="10" fill="#6f8266" text-anchor="middle">Exact page + release record</text>
<path d="M238 280h93" stroke="#759167" stroke-width="2" marker-end="url(#arrow)"/><text x="282" y="267" font-size="9" fill="#72816a" text-anchor="middle">source grant</text>
<path d="M28 181v-91h320M28 181v100h20" fill="none" stroke="#90a77b" stroke-width="1.6" stroke-dasharray="4 5"/>
<text x="592" y="275" font-size="11" fill="#506b45">Workflow coordinates</text><text x="592" y="291" font-size="11" fill="#506b45">the extraction/indexing job.</text>
<rect x="833" y="146" width="186" height="164" rx="12" fill="#f5f2e9" stroke="#c7c0ae" stroke-dasharray="5 5"/><text x="926" y="173" font-size="10" letter-spacing="1" fill="#8d7e61" text-anchor="middle">PLANNED EXTENSIONS</text><text x="926" y="210" font-size="14" fill="#665d4c" text-anchor="middle">Model-assisted answers</text><text x="926" y="235" font-size="11" fill="#8d7e61" text-anchor="middle">Approved model routing</text><text x="926" y="280" font-size="14" fill="#665d4c" text-anchor="middle">Controlled export</text>
<path d="M765 182h57" stroke="#b5ad98" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="23" y="356" font-size="10" fill="#7e8975">Arrows show content direction, not every HTTP request. Each receiving service enforces its own boundary.</text>
</g></svg>
